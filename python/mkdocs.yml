site_name: Teams Lib Wrapper Documentation
site_url: https://pzsp2z1teams.com/
repo_url: https://github.com/pzsp-teams/lib-python
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - content.code.copy
    - navigation.expand
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_category_heading: true

nav:
  - Home: index.md
  - API Reference:
      - Client: reference/client.md
      - Config: reference/config.md
      - Services:
          - Teams: reference/services/teams.md
          - Channels: reference/services/channels.md
          - Chats: reference/services/chats.md
      - Models:
          - Team: reference/models/team.md
          - Channel: reference/models/channel.md
          - Message: reference/models/message.md
          - Member: reference/models/member.md
          - Chat: reference/models/chat.md